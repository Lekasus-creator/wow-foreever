name: WoW Forever - Admin-Funktion bereitstellen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Supabase-Zugriff prüfen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repo-Secret SUPABASE_ACCESS_TOKEN fehlt."
            exit 1
          fi
      - name: Admin-Funktion per Management API deployen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy forever-member-admin --project-ref tsfjsbjjqfpaaizikunv --use-api --debug
